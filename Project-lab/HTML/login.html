<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Page</title>
  <link rel="stylesheet" href="../CSS/style.css">
  <link rel="stylesheet" href="../CSS/login_style.css">
</head>

<body>
  <div class="login-container">
    <div class="login-image">
      <img src="../MEDIA/tw.png" alt="Imagine login">
    </div>
    <div class="separator"></div>
    <form class="login-form" id="loginForm">
      <h1>Login</h1>
      <input type="email" id="email" placeholder="Email (prenume.nume[00]@e-uvt.ro)">
      <input type="password" id="password" placeholder="Parola">
      <button type="submit">Login</button>
      <p class="register-text">
        Nu ai cont? <a href="register.html">Inregistreaza-te</a>
      </p>
    </form>
  </div>

  <script src="../JS/login_js.js"></script>
</body>

</html>
