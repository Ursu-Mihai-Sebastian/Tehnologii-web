<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inregistrare - TW</title>
  <link rel="stylesheet" href="../CSS/register_style.css">
</head>
<body>
  <main class="page">
    <section class="card">
      <h1>Inregistreaza-te</h1>
      <form class="register-form" action="#" method="post" enctype="multipart/form-data">
        
        <div class="row">
          <label for="username">Nume utilizator</label>
          <input type="text" id="username" name="username" placeholder="ex: ioanaTW" required>
        </div>

        <div class="row">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="nume@exemplu.ro" required>
        </div>

        <div class="row two-col">
          <div>
            <label for="password">Parola</label>
            <input type="password" id="password" name="password" required>
          </div>
          <div>
            <label for="confirm_password">Confirma parola</label>
            <input type="password" id="confirm_password" name="confirm_password" required>
          </div>
        </div>

        <div class="row">
          <label for="dob">Data nasterii</label>
          <input type="date" id="dob" name="dob" required>
        </div>

        <div class="row">
          <label>Sex</label>
          <div class="radio-group">
            <label><input type="radio" name="gender" value="male"> Masculin</label>
            <label><input type="radio" name="gender" value="female"> Feminin</label>
            <label><input type="radio" name="gender" value="other"> Altul</label>
          </div>
        </div>

        <div class="row">
          <label for="country">Tara</label>
          <select id="country" name="country" required>
            <option value="" disabled selected>Selecteaza tara</option>
            <option value="ro">Romania</option>
            <option value="de">Germania</option>
            <option value="fr">Franta</option>
            <option value="it">Italia</option>
            <option value="other">Alta</option>
          </select>
        </div>

        <div class="row">
          <label>Interese</label>
          <div class="checkbox-grid">
            <label><input type="checkbox" name="interests" value="frontend"> Frontend</label>
            <label><input type="checkbox" name="interests" value="backend"> Backend</label>
            <label><input type="checkbox" name="interests" value="uiux"> UI/UX</label>
            <label><input type="checkbox" name="interests" value="javascript"> JavaScript</label>
            <label><input type="checkbox" name="interests" value="python"> Python Web</label>
            <label><input type="checkbox" name="interests" value="wordpress"> WordPress</label>
            <label><input type="checkbox" name="interests" value="devops"> DevOps</label>
          </div>
        </div>

        <div class="row">
          <label for="avatar">Poza de profil</label>
          <input type="file" id="avatar" name="avatar" accept="image/*">
        </div>

        <div class="row">
          <label for="bio">Scurta descriere</label>
          <textarea id="bio" name="bio" rows="3" placeholder="Spune-ne cateva cuvinte despre tine"></textarea>
        </div>

        <div class="actions">
          <button type="submit" class="btn primary">Inregistrare</button>
          <button type="reset" class="btn ghost">Reseteaza</button>
        </div>

        <p class="login-link">
          Ai deja cont? <a href="login.html">Mergi la login</a>
        </p>
      </form>
    </section>
  </main>
</body>
</html>
